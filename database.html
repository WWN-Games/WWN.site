<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WWN Database — factions, units and structures</title>
  <meta name="description" content="WWN database: factions, units and structures with stats, roles and filters.">
  <meta name="theme-color" content="#050b16">
  <link rel="canonical" href="https://wwn-games.github.io/WWN.site/database.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wwn-games.github.io/WWN.site/database.html">
  <meta property="og:title" content="WWN Database">
  <meta property="og:description" content="WWN factions, units and structures with stats, roles and filters.">
  <meta property="og:image" content="https://wwn-games.github.io/WWN.site/assets/img/bg/og-banner.webp">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/img/brand/favicon.svg">
  <link rel="apple-touch-icon" href="assets/img/brand/icon-192.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/database.css">
  <link rel="modulepreload" href="assets/js/database.js">
</head>
<body>
<a class="skip-link" href="#main-content" data-i18n="a11y.skip"></a>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="header" id="header">
  <div class="header__inner">
    <a class="brand" href="index.html" aria-label="WWN">
      <img src="assets/img/brand/logo.svg" alt="WWN">
      <span class="brand__sub" data-i18n="brand.sub"></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="index.html#features" data-i18n="nav.features"></a>
      <a href="index.html#factions" data-i18n="nav.factions"></a>
      <a href="index.html#gallery" data-i18n="nav.gallery"></a>
      <a href="index.html#download" data-i18n="nav.download"></a>
      <a href="wiki/" data-i18n="nav.wiki"></a>
      <a href="database.html" class="is-active" data-i18n="database.title"></a>
    </nav>
    <div class="header__side">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang-btn="RU">RU</button>
        <button type="button" data-lang-btn="EN">EN</button>
      </div>
      <button class="icon-btn burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobileNav"><span></span></button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav" inert>
  <a href="index.html" data-i18n="nav.home"></a>
  <a href="index.html#features" data-i18n="nav.features"></a>
  <a href="index.html#factions" data-i18n="nav.factions"></a>
  <a href="index.html#gallery" data-i18n="nav.gallery"></a>
  <a href="index.html#download" data-i18n="nav.download"></a>
  <a href="wiki/" data-i18n="nav.wiki"></a>
  <a href="database.html" class="is-active" data-i18n="database.title"></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang-btn="RU">RU</button>
    <button type="button" data-lang-btn="EN">EN</button>
  </div>
</div>

<main class="database-page" id="main-content">
  <div class="wrap">
    <div class="database-head">
      <span class="kicker" data-i18n="database.title"></span>
      <h1 data-i18n="database.title"></h1>
      <p data-i18n="database.subtitle"></p>
    </div>

    <div class="tabs" id="databaseTabs" role="tablist" data-i18n-aria="database.title">
      <button class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="databaseGrid" data-tab="factions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5 3.8 8.4 9 10 5.2-1.6 9-5 9-10V6z" /></svg>
        <span data-i18n="database.tab.factions"></span>
      </button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="databaseGrid" data-tab="units">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12M4 7l8 5 8-5M12 2 4 7v10l8 5 8-5V7z" /></svg>
        <span data-i18n="database.tab.units"></span>
      </button>
      <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="databaseGrid" data-tab="buildings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l6-4 6 4v13" /><path d="M9 21v-6h4v6M15 12h6v9h-6" /></svg>
        <span data-i18n="database.tab.buildings"></span>
      </button>
    </div>

    <div class="database-toolbar">
      <input type="search" id="databaseSearch" data-i18n-placeholder="database.search.placeholder" data-i18n-aria="database.search.placeholder">
      <select id="databaseFaction" data-dropdown data-i18n-title="database.filter.faction" data-i18n-aria="database.filter.faction"></select>
      <select id="databaseType" data-dropdown data-i18n-title="database.filter.type" data-i18n-aria="database.filter.type"></select>
      <div class="tag-filter" id="tagFilter"></div>
      <select id="databaseSort" data-dropdown data-i18n-title="database.sort.label" data-i18n-aria="database.sort.label"></select>
    </div>

    <output class="database-count" id="databaseCount" aria-live="polite"></output>
    <div class="database-grid" id="databaseGrid" role="tabpanel" tabindex="0"></div>
  </div>
</main>

<footer class="footer footer--compact">
  <div class="wrap footer__bottom">
    <p>© <span id="year"></span> WWN. <span data-i18n="footer.disclaimer"></span></p>
    <a class="btn btn--sm" href="index.html" data-i18n="nav.home"></a>
  </div>
</footer>

<script type="module" src="assets/js/database.js"></script>
</body>
</html>
