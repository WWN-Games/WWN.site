<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Planet">
  <defs>
    <linearGradient id="ringGrad" x1="70" y1="60" x2="450" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe98f"/>
      <stop offset=".3" stop-color="#f8cb1c"/>
      <stop offset=".62" stop-color="#d69500"/>
      <stop offset="1" stop-color="#8a5a00"/>
    </linearGradient>
    <!-- Модули: свет слева, тень справа -->
    <linearGradient id="modGrad" x1="-75" y1="0" x2="75" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe98f"/>
      <stop offset="0.18" stop-color="#f6cf3a"/>
      <stop offset="0.45" stop-color="#dcae00"/>
      <stop offset="0.75" stop-color="#a87a00"/>
      <stop offset="1" stop-color="#6b4d00"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="-55" y1="0" x2="55" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#f8cb1c"/>
      <stop offset="0.7" stop-color="#c99700"/>
      <stop offset="1" stop-color="#7a5800"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="-40" y1="0" x2="40" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9a000"/>
      <stop offset="0.5" stop-color="#8a6500"/>
      <stop offset="1" stop-color="#3a2c00"/>
    </linearGradient>
    <!-- Планета -->
    <radialGradient id="planetBase" cx="-46" cy="-22" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff04a"/>
      <stop offset="0.25" stop-color="#ffd700"/>
      <stop offset="0.55" stop-color="#e2b800"/>
      <stop offset="0.8" stop-color="#b08d00"/>
      <stop offset="1" stop-color="#7c6400"/>
    </radialGradient>
    <radialGradient id="terminator" cx="-40" cy="-30" r="125" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#3a2d00" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#3a2d00" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1c1600" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="crater" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b38f00"/>
      <stop offset="0.6" stop-color="#8f7200"/>
      <stop offset="1" stop-color="#5a4a00"/>
    </radialGradient>
    <radialGradient id="gloss" cx="-52" cy="-34" r="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbb0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fffbb0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="planetClip"><circle r="96"/></clipPath>

    <!-- Один модуль (верхний). Нижний — его зеркальное отражение. -->
    <g id="module">
      <rect x="-75" y="-159" width="150" height="86" rx="12" fill="url(#modGrad)"
            stroke="#2a1e00" stroke-width="3.4" stroke-linejoin="round"/>
      <!-- фаска: свет слева/сверху -->
      <path d="M-68 -86 V-148 Q-68 -153 -63 -153 H20" fill="none" stroke="#f4ee3a" stroke-width="2.6"
            stroke-linecap="round" opacity="0.8"/>
      <path d="M68 -150 V-90" fill="none" stroke="#1d1e00" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>
      <!-- панель -->
      <rect x="-56" y="-142" width="112" height="52" rx="7" fill="url(#panelGrad)"
            stroke="#3c3200" stroke-width="2.6"/>
      <g stroke="#4a3d00" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
        <path d="M-19 -139 V-93"/><path d="M19 -139 V-93"/>
        <path d="M-53 -125 H53"/><path d="M-53 -107 H53"/>
      </g>
      <g stroke="#fff27a" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
        <path d="M-17.5 -139 V-93"/><path d="M20.5 -139 V-93"/>
        <path d="M-53 -123.5 H53"/><path d="M-53 -105.5 H53"/>
      </g>
      <!-- блики на панели -->
      <ellipse cx="-40" cy="-134" rx="9" ry="4" fill="#fffbb0" opacity="0.8"/>
      <ellipse cx="-4" cy="-117" rx="7" ry="3" fill="#fff27a" opacity="0.55"/>
      <!-- переходное кольцо к планете -->
      <rect x="-42" y="-84" width="84" height="16" rx="4" fill="url(#collarGrad)"
            stroke="#2a1e00" stroke-width="3.4"/>
      <path d="M-36 -80 H8" stroke="#c9c400" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>
  </defs>

  <!-- рамка -->
  <rect x="60" y="60" width="392" height="392" rx="74" fill="none" stroke="url(#ringGrad)" stroke-width="30"/>
  <rect x="45.5" y="45.5" width="421" height="421" rx="88" fill="none" stroke="#fff2b8" stroke-width="2.5" opacity=".35"/>

  <g transform="translate(256 256) rotate(29.6)">
    <use href="#module"/>
    <use href="#module" transform="scale(1 -1)"/>

    <!-- планета -->
    <circle r="96" fill="url(#planetBase)"/>
    <g clip-path="url(#planetClip)">
      <!-- широтные полосы -->
      <path d="M-82.8 -48.59 Q-1.35 -34.17 80.1 -52.92" fill="none" stroke="#f2c400" stroke-width="10" opacity="0.35"/>
      <path d="M-93.5 21.75 Q0.75 46.18 95.01 13.76" fill="none" stroke="#b08d00" stroke-width="12" opacity="0.35"/>
      <path d="M-67.49 68.27 Q3.92 78.68 75.33 59.5" fill="none" stroke="#fff06a" stroke-width="6" opacity="0.25"/>
      <!-- кратеры -->
      <g>
        <ellipse cx="38" cy="-28" rx="22" ry="17" fill="url(#crater)" opacity="0.85"/>
        <path d="M18 -34 Q26 -46 46 -44" fill="none" stroke="#ffe55a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <ellipse cx="52" cy="22" rx="18" ry="22" fill="url(#crater)" opacity="0.8"/>
        <ellipse cx="-4" cy="52" rx="24" ry="14" fill="url(#crater)" opacity="0.8"/>
        <path d="M-24 46 Q-12 36 8 40" fill="none" stroke="#ffe55a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
        <ellipse cx="-14" cy="-6" rx="11" ry="8" fill="#b89200" opacity="0.5"/>
        <ellipse cx="-58" cy="22" rx="9" ry="12" fill="#c9a000" opacity="0.5"/>
        <ellipse cx="14" cy="14" rx="6" ry="5" fill="#8a6f00" opacity="0.6"/>
      </g>
      <circle r="96" fill="url(#terminator)"/>
      <circle r="96" fill="url(#gloss)"/>
      <!-- рефлекс на краю в тени -->
      <path d="M62 62 A96 96 0 0 1 8 94" fill="none" stroke="#e8b800" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
    </g>
    <circle r="96" fill="none" stroke="#2a1e00" stroke-width="3.4" opacity=".9"/>
  </g>
</svg>
