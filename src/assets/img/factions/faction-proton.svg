      <stop offset="0" stop-color="#f0394d"/>
      <stop offset=".5" stop-color="#d21f33"/>
      <stop offset="1" stop-color="#a30d20"/>
    </linearGradient>
    <linearGradient id="pro-star" x1="160" y1="110" x2="350" y2="340" gradientUnits="userSpaceOnUse">
