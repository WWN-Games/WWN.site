<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WWN Wiki — lore, factions, units, mechanics and guides</title>
  <meta name="description" content="The complete WWN wiki for Rusted Warfare: universe lore, factions, unit and structure database, mechanics, guides and releases.">
  <meta name="theme-color" content="#050b16">
  <link rel="canonical" href="https://wwn-games.github.io/WWN.site/wiki/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wwn-games.github.io/WWN.site/wiki/">
  <meta property="og:title" content="WWN Wiki">
  <meta property="og:description" content="Lore, factions, units, structures, mechanics and guides of the WWN mod.">
  <meta property="og:image" content="https://wwn-games.github.io/WWN.site/assets/img/bg/og-banner.webp">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="../assets/img/brand/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/img/brand/icon-192.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/wiki.css">
  <link rel="modulepreload" href="../assets/js/wiki.js">
  <link rel="modulepreload" href="../assets/js/wiki-shell.js">
  <script>
    (() => {
      let lang; try { lang = localStorage.getItem("wwn-lang"); } catch (e) {}
      if (lang !== "ru" && lang !== "en") lang = (navigator.language || "ru").slice(0, 2).toLowerCase() === "ru" ? "ru" : "en";
      const add = (rel, href, as, type) => {
        const link = document.createElement("link");
        link.rel = rel;
        link.href = href;
        if (as) link.as = as;
        if (type) link.type = type;
        if (rel === "preload") link.crossOrigin = "";
        document.head.append(link);
      };
      add("modulepreload", "../assets/js/i18n/wiki." + lang + ".js");
      for (const font of lang === "ru" ? ["geist-cyrillic", "science-gothic-cyrillic"] : ["geist-latin", "science-gothic-latin"]) {
        add("preload", "../assets/fonts/" + font + ".woff2", "font", "font/woff2");
      }
    })();
  </script>
</head>
<body class="wiki-body">
<a class="skip-link" href="#main-content" data-i18n="a11y.skip"></a>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="header" id="header">
  <div class="header__inner">
    <a class="brand" href="../index.html" aria-label="WWN">
      <img src="../assets/img/brand/logo.svg" alt="WWN">
      <span class="brand__sub" data-i18n="brand.sub"></span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="../index.html#features" data-i18n="nav.features"></a>
      <a href="../index.html#factions" data-i18n="nav.factions"></a>
      <a href="../index.html#gallery" data-i18n="nav.gallery"></a>
      <a href="../index.html#download" data-i18n="nav.download"></a>
      <a href="./" class="is-active" data-i18n="nav.wiki"></a>
      <a href="../database.html" data-i18n="database.title"></a>
    </nav>
    <div class="header__side">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang-btn="RU">RU</button>
        <button type="button" data-lang-btn="EN">EN</button>
      </div>
      <button class="icon-btn burger" id="burger" type="button" aria-label="Menu" aria-controls="mobileNav" popovertarget="mobileNav"><span></span></button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav" popover="auto">
  <a href="../index.html" data-i18n="nav.home"></a>
  <a href="../index.html#features" data-i18n="nav.features"></a>
  <a href="../index.html#factions" data-i18n="nav.factions"></a>
  <a href="../index.html#gallery" data-i18n="nav.gallery"></a>
  <a href="../index.html#download" data-i18n="nav.download"></a>
  <a href="./" class="is-active" data-i18n="nav.wiki"></a>
  <a href="../database.html" data-i18n="database.title"></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang-btn="RU">RU</button>
    <button type="button" data-lang-btn="EN">EN</button>
  </div>
</div>

<div class="wiki-shell">
  <aside class="wiki-sidebar" data-i18n-aria="wiki.sidebar">
    <div class="wiki-sidebar__search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>
      <input type="search" id="searchInput" data-i18n-placeholder="wiki.search.placeholder" data-i18n-aria="wiki.search.placeholder">
      <kbd class="wiki-sidebar__kbd">Ctrl K</kbd>
    </div>
    <button type="button" id="wikiNavToggle" class="wiki-nav__toggle" aria-controls="wikiNav" data-i18n="wiki.sidebar"></button>
    <nav class="wiki-nav" id="wikiNav" data-i18n-aria="wiki.title"></nav>
    <div class="wiki-sidebar__cta">
      <p data-i18n="wiki.help"></p>
      <a class="btn btn--sm" href="../index.html#download" data-i18n="nav.download"></a>
    </div>
  </aside>

  <main id="main-content">
    <section class="wiki-hero">
      <div class="wiki-hero__content">
        <span class="kicker" data-i18n="nav.wiki"></span>
        <h1 data-i18n="wiki.title"></h1>
        <p data-i18n="wiki.subtitle"></p>
        <div class="wiki-hero__stats" id="wikiHeroStats"></div>
      </div>
    </section>

    <div class="wiki-cat-grid" id="wikiCategories"></div>
  </main>
</div>

<dialog class="search-panel" id="searchPanel" data-i18n-aria="wiki.search.title">
  <div class="search-panel__box">
    <search>
      <input class="search-panel__input" id="searchPanelInput" type="search" autocomplete="off" data-i18n-placeholder="wiki.search.placeholder" data-i18n-aria="wiki.search.title">
    </search>
    <p class="search-panel__hint" id="searchHint" role="status" data-i18n="wiki.search.hint"></p>
    <div class="search-results" id="searchResults"></div>
  </div>
</dialog>

<footer class="footer footer--compact">
  <div class="wrap footer__bottom">
    <p>© <span id="year"></span> WWN. <span data-i18n="footer.disclaimer"></span></p>
    <a class="btn btn--sm" href="../index.html" data-i18n="nav.home"></a>
  </div>
</footer>

<a class="to-top" id="toTop" href="#top" data-i18n-aria="footer.backToTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg></a>

<script type="module" src="../assets/js/wiki.js"></script>
</body>
</html>
