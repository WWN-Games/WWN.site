  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:url" content="https://wwn-games.github.io/WWN.site/wiki/">

  <link rel="icon" type="image/svg+xml" href="../assets/img/brand/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/img/brand/icon-192.png">

  <link rel="modulepreload" href="../assets/js/utils.js">
  <link rel="modulepreload" href="../assets/js/ui.js">
  <link rel="modulepreload" href="../assets/js/stats-data.js">
  <script>
    (() => {
      const param = new URLSearchParams(location.search).get("lang");
      let lang; try { lang = localStorage.getItem("wwn-lang"); } catch (e) {}
      if (param === "ru" || param === "en") lang = param;
      if (lang !== "ru" && lang !== "en") lang = (navigator.language || "ru").slice(0, 2).toLowerCase() === "ru" ? "ru" : "en";
      document.documentElement.lang = lang;
      // фон hero — сразу, чтобы картинка нашлась до инициализации модулей
      const heroUrl = (file) => new URL(`../assets/img/lore/${file}`, location.href).href;
      document.documentElement.style.setProperty(
        "--wiki-hero-img",
        `image-set(url("${heroUrl(`tc-${lang}-960.avif`)}") 1x, url("${heroUrl(`tc-${lang}.avif`)}") 2x)`
      );
      if (!param && lang === "en") {
        const url = new URL(location.href);
        url.searchParams.set("lang", "en");
        history.replaceState(null, "", url);
      }
      const add = (rel, href, as, type) => {
        const link = document.createElement("link");
        link.rel = rel;
        link.href = href;
        if (as) link.as = as;
        if (type) link.type = type;
        if (rel === "preload") link.crossOrigin = "";
        document.head.append(link);
      };
      add("modulepreload", "../assets/js/i18n/wiki." + lang + ".js");
      for (const font of lang === "ru" ? ["geist-cyrillic", "science-gothic-cyrillic"] : ["geist-latin", "science-gothic-latin"]) {
        add("preload", "../assets/fonts/" + font + ".woff2", "font", "font/woff2");
      }
    })();
  </script>
</head>
<body class="wiki-body">
<a class="skip-link" href="#main-content" data-i18n="a11y.skip"></a>

    <nav class="nav" aria-label="Main" data-i18n-aria="a11y.nav">

    <div class="header__side">

    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav" popover="auto">
  <a href="../" data-i18n="nav.home"></a>

<div class="wiki-shell">

      <input type="search" id="searchInput" data-i18n-placeholder="wiki.search.placeholder" data-i18n-aria="wiki.search.placeholder">

    </div>

      <p data-i18n="wiki.help"></p>
      <a class="btn btn--sm" href="../#download" data-i18n="nav.download"></a>
    </div>
  </aside>

  <main id="main-content">
    <section class="wiki-hero">
      <div class="wiki-hero__content">
        <span class="kicker" data-i18n="nav.wiki"></span>

        <div class="wiki-hero__stats" id="wikiHeroStats"></div>

</dialog>
