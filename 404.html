  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-family: "Exo 2", system-ui, sans-serif;
      color: #eef5ff;
      background:
        radial-gradient(900px 520px at 70% 0%, rgba(31, 104, 190, 0.35), transparent 60%),
        radial-gradient(120% 100% at 50% 120%, rgba(44, 182, 255, .12), transparent 60%),
        #04070f;
    }
    .logo { width: 190px; margin: 0 auto 22px; filter: drop-shadow(0 0 24px rgba(44, 182, 255, .45)); }
    .code {
      font-family: "Russo One", system-ui, sans-serif;
      font-size: clamp(72px, 18vw, 150px);
      line-height: 1;
      background: linear-gradient(120deg, #8ee0ff, #2f8dff 60%, #b9e6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { font-family: "Russo One", system-ui, sans-serif; font-size: clamp(20px, 4vw, 30px); margin: 14px 0 10px; }
    p { color: #8ba6c9; max-width: 460px; margin: 0 auto 26px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block;
      padding: 13px 24px;
      font-family: "Russo One", system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #03101d;
      background: linear-gradient(180deg, #38c3ff, #1a7fd4);
      border-radius: 10px;
      transition: transform .2s, box-shadow .2s;
    }
    a.btn.ghost { color: #eef5ff; background: rgba(16, 34, 58, .6); border: 1px solid rgba(88, 178, 255, .42); }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(16, 110, 190, .45); }
    .lang { margin-top: 26px; display: inline-flex; border: 1px solid rgba(88, 178, 255, .42); border-radius: 10px; overflow: hidden; }
    .lang button {
      padding: 8px 14px; font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .08em;
      color: #8ba6c9; background: rgba(9, 19, 34, .7); border: 0; cursor: pointer; transition: .2s;
    }
    .lang button + button { border-left: 1px solid rgba(88, 178, 255, .18); }
    .lang button.is-active { background: linear-gradient(180deg, #38c3ff, #1a7fd4); color: #03101d; }
  </style>

    <div class="code">404</div>
    <h1 data-i18n="notfound.title">Lost in space</h1>
    <p data-i18n="notfound.desc">This page doesn't exist.</p>
    <div class="row">
      <a class="btn" id="homeLink" href="/" data-i18n="notfound.home">Go home</a>
      <a class="btn ghost" id="wikiLink" href="wiki/" data-i18n="notfound.wiki">Open the wiki</a>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang-btn="RU">RU</button>
      <button type="button" data-lang-btn="EN">EN</button>
    </div>
  </main>

  <script type="module">
    // 404 может открываться на любой глубине пути (dev-сервер или GitHub Pages),
    // поэтому корень сайта ищем перебором, а тексты подгружаем из i18n.
    const STORED = (() => { try { return localStorage.getItem("wwn-lang"); } catch (e) { return null; } })();
    const lang = STORED || ((navigator.language || "en").slice(0, 2).toLowerCase() === "ru" ? "ru" : "en");
    document.documentElement.lang = lang;

    let base = null;
    for (const prefix of ["./", "../", "../../", "../../../"]) {
      try {
        const res = await fetch(`${prefix}data/wiki-nav.json`, { method: "HEAD" });
        if (res.ok) { base = prefix; break; }
      } catch (e) {}
    }
    base ??= "./";

    const home = document.getElementById("homeLink");
    const wiki = document.getElementById("wikiLink");
    home.href = `${base}index.html`;
    wiki.href = `${base}wiki/`;

    try {
      const i18n = await import(`${base}assets/js/i18n.js`);
      i18n.applyI18n(lang);
      document.title = `404 — WWN`;
      i18n.initLangSwitch();
      document.addEventListener("wwn:langchange", (event) => i18n.applyI18n(event.detail.lang));
    } catch (e) {
      // без модуля — статичные английские тексты уже в разметке
    }
  </script>
