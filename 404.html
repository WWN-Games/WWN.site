<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — WWN</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050b16">
  <link rel="icon" type="image/svg+xml" href="assets/img/brand/favicon.svg" data-base>
  <link rel="apple-touch-icon" href="assets/img/brand/icon-192.png" data-base>
  <link rel="manifest" href="site.webmanifest" data-base>
  <style>
    html { color-scheme: dark; }
    body.notfound-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
      text-align: center;
      background:
        radial-gradient(900px 520px at 70% 0%, rgba(31, 104, 190, .35), transparent 60%),
        radial-gradient(120% 100% at 50% 120%, rgba(44, 182, 255, .12), transparent 60%),
        var(--bg-0, #04070f);
    }
    .notfound { display: grid; justify-items: center; gap: 16px; max-width: 560px; }
    .notfound__logo { width: min(190px, 58vw); height: auto; filter: drop-shadow(0 0 24px rgba(var(--cyan-rgb, 44, 182, 255), .45)); }
    .notfound__code {
      font-family: var(--font-display, sans-serif);
      font-size: clamp(72px, 18vw, 140px);
      line-height: 1;
      background: var(--grad-text, linear-gradient(120deg, #8ee0ff, #2f8dff 60%, #b9e6ff));
      background-clip: text;
      color: transparent;
    }
    @media (forced-colors: active) { .notfound__code { color: CanvasText; background: none; } }
    .notfound h1 { font-size: clamp(20px, 4vw, 28px); }
    .notfound p { color: var(--muted, #8ba6c9); max-width: 460px; }
    .notfound__actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 26px;
      font-family: var(--font-display, sans-serif);
      font-size: 13px;
      letter-spacing: .07em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text, #eef5ff);
      background: rgba(148, 163, 184, .12);
      border: 1px solid rgba(148, 163, 184, .26);
      border-radius: 12px;
    }
  </style>
</head>
<body class="notfound-page">
  <main class="notfound">
    <img class="notfound__logo" src="assets/img/brand/logo.svg" alt="WWN" width="190" height="56" data-base>
    <div class="notfound__code">404</div>
    <h1 data-i18n="notfound.title"></h1>
    <p data-i18n="notfound.desc"></p>
    <div class="notfound__actions">
      <a class="btn" id="homeLink" href="./" data-i18n="notfound.home"></a>
      <a class="btn" id="wikiLink" href="wiki/" data-i18n="notfound.wiki"></a>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang-btn="RU">RU</button>
      <button type="button" data-lang-btn="EN">EN</button>
    </div>
  </main>

  <script type="module">
    // 404 может открываться на любой глубине пути (dev-сервер или GitHub Pages),
    // поэтому корень сайта ищем перебором, а тексты подгружаем из i18n.
    const STORED = (() => { try { return localStorage.getItem("wwn-lang"); } catch (e) { return null; } })();
    const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase() === "ru" ? "ru" : "en";
    const lang = STORED === "ru" || STORED === "en" ? STORED : browserLang;
    document.documentElement.lang = lang;

    // 404 отдаётся на любой глубине URL, поэтому корень сайта ищем перебором:
    // поднимаемся на уровень выше, пока не найдём data/wiki-nav.json.
    const depth = location.pathname.split("/").filter(Boolean).length;
    const prefixes = Array.from({ length: Math.min(depth + 2, 8) }, (_, i) => "../".repeat(i) || "./");
    let base = null;
    for (const prefix of prefixes) {
      try {
        const res = await fetch(`${prefix}data/wiki-nav.json`, { method: "HEAD" });
        if (res.ok) { base = prefix; break; }
      } catch (e) {}
    }
    base ??= "./";

    const fonts = document.createElement("link");
    fonts.rel = "stylesheet";
    fonts.href = `${base}assets/css/fonts.css`;
    const theme = document.createElement("link");
    theme.rel = "stylesheet";
    theme.href = `${base}assets/css/style.css`;
    document.head.append(fonts, theme);

    document.querySelectorAll("[data-base]").forEach((el) => {
      const path = `${base}${el.getAttribute("href") || el.getAttribute("src")}`;
      if (el.tagName === "IMG") el.src = path;
      else el.href = path;
    });
    document.getElementById("homeLink").href = `${base}index.html`;
    document.getElementById("wikiLink").href = `${base}wiki/`;

    try {
      const i18n = await import(`${base}assets/js/i18n.js`);
      i18n.applyI18n(lang);
      i18n.initLangSwitch();
    } catch (e) {
      // модуль не загрузился — тексты останутся пустыми (сайт рассчитан на работу с JS)
    }
  </script>
</body>
</html>
